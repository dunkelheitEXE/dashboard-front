<section class="auth">
  <form class="auth__card" [formGroup]="form" (ngSubmit)="onSubmit()">
    <header class="auth__header">
      <h1 class="auth__title">Crear cuenta</h1>
      <p class="auth__subtitle">Regístrate para empezar a usar el dashboard</p>
    </header>

    <label class="field">
      <span class="field__label">Nombre</span>
      <input
        class="field__input"
        type="text"
        formControlName="name"
        autocomplete="name"
        placeholder="Tu nombre"
      />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <span class="field__error">El nombre es obligatorio</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Usuario</span>
      <input
        class="field__input"
        type="text"
        formControlName="username"
        autocomplete="username"
        placeholder="tu_usuario"
      />
      @if (form.controls.username.touched && form.controls.username.invalid) {
        <span class="field__error">El usuario es obligatorio</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Contraseña</span>
      <input
        class="field__input"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        placeholder="Mínimo 6 caracteres"
      />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field__error">La contraseña debe tener al menos 6 caracteres</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Confirmar contraseña</span>
      <input
        class="field__input"
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
        placeholder="Repite la contraseña"
      />
      @if (form.controls.confirmPassword.touched && form.hasError('passwordsMismatch')) {
        <span class="field__error">Las contraseñas no coinciden</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Foto (URL) <span class="field__optional">opcional</span></span>
      <input
        class="field__input"
        type="url"
        formControlName="photo"
        placeholder="https://..."
      />
    </label>

    @if (error()) {
      <p class="auth__alert auth__alert--error">{{ error() }}</p>
    }

    <button class="auth__submit" type="submit" [disabled]="loading()">
      {{ loading() ? 'Creando cuenta…' : 'Crear cuenta' }}
    </button>

    <p class="auth__switch">
      ¿Ya tienes cuenta? <a routerLink="/">Inicia sesión</a>
    </p>
  </form>
</section>
