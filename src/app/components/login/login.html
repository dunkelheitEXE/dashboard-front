<section class="auth">
  <form class="auth__card" [formGroup]="form" (ngSubmit)="onSubmit()">
    <header class="auth__header">
      <h1 class="auth__title">Iniciar sesión</h1>
      <p class="auth__subtitle">Ingresa con tu cuenta para continuar</p>
    </header>

    <label class="field">
      <span class="field__label">Usuario</span>
      <input
        class="field__input"
        type="text"
        formControlName="username"
        autocomplete="username"
        placeholder="tu_usuario"
      />
      @if (form.controls.username.touched && form.controls.username.invalid) {
        <span class="field__error">El usuario es obligatorio</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Contraseña</span>
      <input
        class="field__input"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        placeholder="••••••••"
      />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field__error">La contraseña es obligatoria</span>
      }
    </label>

    @if (error()) {
      <p class="auth__alert auth__alert--error">{{ error() }}</p>
    }

    <button class="auth__submit" type="submit" [disabled]="loading()">
      {{ loading() ? 'Ingresando…' : 'Ingresar' }}
    </button>

    <p class="auth__switch">
      ¿No tienes cuenta? <a routerLink="/signup">Regístrate</a>
    </p>
  </form>
</section>
